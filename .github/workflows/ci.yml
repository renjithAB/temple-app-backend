name: CI / CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: temple_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm run test
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/temple_platform_test?schema=public"
          JWT_ISSUER: "temple-platform"
          JWT_AUDIENCE: "temple-platform-clients"
          OTP_HMAC_SECRET: "test-otp-hmac-secret-at-least-32-chars-long"
          QR_SIGNING_SECRET: "test-qr-signing-secret-at-least-32-chars-long"

      - name: Build TypeScript output
        run: npm run build
